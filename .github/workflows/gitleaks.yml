name: Gitleaks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks/scan
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/path" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb git --log-opts="--all" --redact --report-format sarif --report-path /path/gitleaks.sarif /path
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
